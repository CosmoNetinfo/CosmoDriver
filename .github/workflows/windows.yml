name: Windows · build, test e release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Versione
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = $props.Project.PropertyGroup.Version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag/version mismatch' }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
      - name: Build, test e pacchetti
        shell: pwsh
        run: ./scripts/Build.ps1 -Version $env:APP_VERSION
      - name: Smoke test su WMI e interfaccia reali
        shell: pwsh
        run: |
          $process = Start-Process artifacts/publish/CosmoDriver.exe -ArgumentList '--smoke', 'artifacts/smoke' -PassThru
          if (-not $process.WaitForExit(180000)) { $process.Kill(); throw 'Smoke timeout' }
          if ($process.ExitCode) { Get-Content artifacts/smoke/smoke-results.json; throw 'Smoke failed' }
      - name: Test installer e disinstallazione
        shell: pwsh
        run: ./scripts/Test-Packages.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: CosmoDriver-Windows-x64
          path: |
            artifacts/*.exe
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
            artifacts/smoke/
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verifica tag su main
        shell: pwsh
        run: |
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE) { throw 'Only releases from main are permitted' }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: CosmoDriver-Windows-x64
          path: artifacts
      - name: Firma e pubblica release
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ./scripts/Test-AutoUpdate.ps1
          ./scripts/Sign-Release.ps1 -Version $env:RELEASE_TAG.Substring(1)
          $files = @(Get-ChildItem artifacts -File | ForEach-Object FullName)
          gh release create $env:RELEASE_TAG @files --verify-tag --title "CosmoDriver $env:RELEASE_TAG" --notes "CosmoDriver by CosmoNet. Installer per utente e EXE portatile Windows x64. Aggiornamenti automatici verificati tramite manifest firmato. Consulta README per utilizzo, privacy e limiti della scansione. Gli EXE non hanno firma Authenticode."
          if ($LASTEXITCODE) { throw 'Release publication failed' }
